<body>
  <div id="options-header">
    <button id="back-btn" type="button" title="Back">←</button>
    <h1>Options</h1>
  </div>
  <label class="option-row">
    <input type="checkbox" id="favicon-only-default" />
    <span>Show only favicons for default (unfoldered) bookmarks</span>
  </label>
  <label class="option-row">
    <span>Theme</span>
    <select id="theme-select">
      <option value="system">System</option>
      <option value="dark">Dark</option>
      <option value="light">Light</option>
    </select>
  </label>
  <label class="option-row">
    <input type="checkbox" id="density-compact" />
    <span>Compact mode (tighter spacing)</span>
  </label>
  <script src="../shared/theme.js"></script>
  <script src="options.js"></script>
</body>
